name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release tag and package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          release_version="${package_version%%+*}"
          test -n "$package_version"
          test "v$release_version" = "$GITHUB_REF_NAME"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[0-9]+$ ]]; then
            echo "Expected a SemVer package version with build metadata, got $package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
          if [[ "$release_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  android-linux:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsecret-1-0
      - name: Require Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: test -n "$KEYSTORE" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD" -a -n "$STORE_PASSWORD"
      - name: Configure Android signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/servergy-release.jks
          printf 'storeFile=servergy-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/generate_launcher_icons.dart
      - run: git diff --exit-code -- android/app/src/main/res windows/runner/resources linux/packaging/icons assets/branding
      - run: flutter build apk --release
      - run: flutter build linux --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/servergy-${GITHUB_REF_NAME}.apk
          tar -C build/linux/x64/release/bundle -czf dist/servergy-${GITHUB_REF_NAME}-linux.tar.gz .
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android-linux
          path: dist

  windows:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Require Windows signing secrets
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: if (!$env:CERTIFICATE -or !$env:CERTIFICATE_PASSWORD) { throw 'Windows signing secrets are required.' }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/generate_launcher_icons.dart
      - run: git diff --exit-code -- windows/runner/resources assets/branding
      - run: flutter build windows --release
      - name: Sign executable and package
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('servergy.pfx', [Convert]::FromBase64String($env:CERTIFICATE))
          signtool sign /fd SHA256 /f servergy.pfx /p $env:CERTIFICATE_PASSWORD build/windows/x64/runner/Release/servergy.exe
          signtool verify /pa build/windows/x64/runner/Release/servergy.exe
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/servergy-$env:GITHUB_REF_NAME-windows.zip
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist

  publish:
    needs: [validate-release, android-linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          files: dist/*
