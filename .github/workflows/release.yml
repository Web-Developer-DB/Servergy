name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release tag and package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          release_version="${package_version%%+*}"
          test -n "$package_version"
          test "v$release_version" = "$GITHUB_REF_NAME"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[0-9]+$ ]]; then
            echo "Expected a SemVer package version with build metadata, got $package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
          if [[ "$release_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  android-linux:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsecret-1-0
      - name: Download verified appimagetool
        env:
          APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
        run: |
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 --output "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum --check --strict
          chmod +x "$tool"
      - name: Require Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: test -n "$KEYSTORE" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD" -a -n "$STORE_PASSWORD"
      - name: Configure Android signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/servergy-release.jks
          printf 'storeFile=servergy-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/generate_launcher_icons.dart
      - run: git diff --exit-code -- android/app/src/main/res windows/runner/resources linux/packaging/icons assets/branding
      - run: flutter build apk --release
      - name: Build Linux AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 \
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
          linux/packaging/build-appimage.sh
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/servergy-${GITHUB_REF_NAME}.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-linux
          path: dist

  publish:
    needs: [validate-release, android-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          files: dist/*
